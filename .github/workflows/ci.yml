name: CI

# Manual only, one suite per run, to keep Actions usage low.
# Example: gh workflow run CI -f suite=sandbox
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which single test suite to run
        required: true
        default: unit
        type: choice
        options:
          - unit
          - sandbox
          - e2e-vanilla
          - e2e-all-flavors
          - panel
          - release
          - tailnet-test

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  unit:
    name: Unit tests and lints
    if: inputs.suite == 'unit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-
      - run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - run: cargo clippy -p emberd -p ember-proto -p ember-probe --all-targets -- -D warnings
      - run: cargo test -p ember-proto -p emberd

  sandbox:
    name: Sandbox escape attempts
    if: inputs.suite == 'sandbox'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build -p emberd -p ember-probe
      - run: sudo ./target/debug/emberd doctor
      - run: sudo bash scripts/ci-sandbox.sh

  e2e:
    name: Real Minecraft end to end
    if: inputs.suite == 'e2e-vanilla' || inputs.suite == 'e2e-all-flavors'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build -p emberd
      - name: Run end-to-end test
        env:
          FLAVORS: ${{ inputs.suite == 'e2e-all-flavors' && 'paper,fabric,forge' || '' }}
        run: sudo python3 scripts/e2e.py --emberd ./target/debug/emberd --flavors "$FLAVORS"

  # A time-limited test node for trying the panel over real Tailscale. Not for hosting:
  # it stops itself after 20 minutes and leaves the tailnet, whatever happens.
  tailnet-test:
    name: Temporary test node on Tailscale
    if: inputs.suite == 'tailnet-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_MINUTES: "20"
    steps:
      - name: Check required secrets
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          EMBER_OWNER: ${{ secrets.EMBER_OWNER }}
        run: |
          if [ -z "$TS_AUTHKEY" ] || [ -z "$EMBER_OWNER" ]; then
            echo "::error::Set the TS_AUTHKEY and EMBER_OWNER repository secrets first."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build -p emberd
      - name: Install requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables iproute2
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq tailscale
          sudo systemctl enable --now tailscaled
      - name: Join the tailnet
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          key_file=$(mktemp)
          chmod 600 "$key_file"
          printf '%s' "$TS_AUTHKEY" > "$key_file"
          sudo tailscale up --auth-key="file:$key_file" --hostname="ember-ci-$GITHUB_RUN_ID" --accept-dns=false --accept-routes=false
          rm -f "$key_file"
          tailscale ip -4
      - name: Install emberd
        env:
          EMBER_OWNER: ${{ secrets.EMBER_OWNER }}
        run: sudo bash packaging/install.sh ./target/debug/emberd "$EMBER_OWNER"
      - name: Stay up for the test window
        run: |
          echo "Test node is up as ember-ci-$GITHUB_RUN_ID for $TEST_MINUTES minutes."
          end=$(( $(date +%s) + TEST_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            if [ "$(systemctl is-active emberd)" != "active" ]; then
              echo "::error::emberd stopped unexpectedly."
              sudo journalctl -u emberd -n 40 --no-pager -o cat
              exit 1
            fi
            sleep 30
          done
          echo "Test window finished."
      - name: Stop servers and leave the tailnet
        if: always()
        run: |
          sudo systemctl stop emberd || true
          sudo tailscale logout || true

  panel:
    name: Desktop app (Windows)
    if: inputs.suite == 'panel'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-
      - run: rustup toolchain install stable --profile minimal; rustup default stable
      - run: cargo test -p ember-panel
      - run: cargo build --release -p ember-panel
      - uses: actions/upload-artifact@v4
        with:
          name: ember-panel-windows
          path: target/release/ember-panel.exe
          retention-days: 7

  release:
    name: Daemon release build
    if: inputs.suite == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release -p emberd
      - uses: actions/upload-artifact@v4
        with:
          name: emberd-linux-x86_64
          path: |
            target/release/emberd
            packaging/*
          retention-days: 7
