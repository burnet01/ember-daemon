name: Publish

# Tests and builds the daemon and publishes it as a release. Nodes install releases by
# themselves, so nothing is published unless the full tests pass on the exact
# daemon being released. Runs only when a version tag is pushed or by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, like v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish

env:
  CARGO_TERM_COLOR: always

jobs:
  daemon:
    name: Linux daemon
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools nftables iproute2 openssh-client libarchive-tools
      - run: rustup toolchain install stable --profile minimal -t x86_64-unknown-linux-musl && rustup default stable
      - run: cargo test -p ember-proto -p emberd
      # Static, so one file runs on any distro whatever its system libraries.
      - run: cargo build --release -p emberd -p ember-probe --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/emberd emberd-linux-x86_64
      - name: Sandbox escape attempts
        env:
          EMBERD: ./target/x86_64-unknown-linux-musl/release/emberd
          PROBE: ./target/x86_64-unknown-linux-musl/release/ember-probe
        run: sudo -E bash scripts/ci-sandbox.sh
      - name: Real Minecraft end to end
        run: sudo python3 scripts/e2e.py --emberd ./emberd-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: daemon
          path: emberd-linux-x86_64
          retention-days: 1

  release:
    name: Publish the release
    needs: daemon
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          sha256sum emberd-linux-x86_64 > emberd-linux-x86_64.sha256
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Ember $TAG" --generate-notes --latest \
            emberd-linux-x86_64 emberd-linux-x86_64.sha256
