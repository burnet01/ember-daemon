[workspace]
resolver = "2"
members = ["crates/ember-proto", "crates/emberd", "crates/ember-probe"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
ember-proto = { path = "crates/ember-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"
